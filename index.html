<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সমবায় সমিতি ম্যানেজমেন্ট</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f766e, #164e63);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0f766e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      color: #164e63;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0f766e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #115e59;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🏦</div>

    <h1>সমবায় সমিতি</h1>

    <p class="subtitle">
      ম্যানেজমেন্ট সিস্টেম
    </p>

    <form>

      <label>ইমেইল / ইউজারনেম</label>

      <input
        type="text"
        placeholder="আপনার ইমেইল লিখুন"
      >

      <label>পাসওয়ার্ড</label>

      <input
        type="password"
        placeholder="আপনার পাসওয়ার্ড লিখুন"
      >

      <button type="button">
        লগইন করুন
      </button>

    </form>

    <div class="footer">
      © 2026 Cooperative Management System
    </div>

  </div>

</body>
  <!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://tcdilhooslygsvdcqkte.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "এখানে_তোমার_কপি_করা_Publishable_Key_পেস্ট_করো";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,

  );

  console.log("Supabase connected:", !!supabaseClient);
</script>
</html>
