<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সমবায় সমিতি ম্যানেজমেন্ট</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 5px 0;
      color: #146c43;
      font-size: 26px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #146c43;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #146c43;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f5132;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .loading {
      color: #555;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🏦</div>

    <h1>সমবায় সমিতি</h1>
    <div class="subtitle">ম্যানেজমেন্ট সিস্টেম</div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="ইমেইল"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="পাসওয়ার্ড"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        লগইন করুন
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://tcdilhooslygsvdcqkte.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_JelXduaAwElDbU0JABTFgg_yLXzPyNx";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(e) {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.className = "loading";
      message.textContent = "লগইন হচ্ছে...";

      loginButton.disabled = true;
      loginButton.textContent = "অপেক্ষা করুন...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.className = "error";
        message.textContent =
          "লগইন ব্যর্থ: " + error.message;

        loginButton.disabled = false;
        loginButton.textContent = "লগইন করুন";

        return;
      }

      message.className = "success";
      message.textContent = "লগইন সফল হয়েছে!";

      loginButton.textContent = "সফল হয়েছে";

      setTimeout(function() {
        alert("স্বাগতম! Dashboard পরবর্তী ধাপে তৈরি করা হবে।");
      }, 500);

    });

  </script>

</body>
</html>
