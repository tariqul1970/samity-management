/* =========================
MEMBER ID
========================= */

async function generateMemberId(){

const result =
await supabaseClient
.from("members")
.select("member_id")
.order(
"member_id",
{ascending:false}
)
.limit(1);


if(
result.error ||
!result.data ||
result.data.length===0
){

return "000001";

}


const last =
parseInt(
result.data[0].member_id,
10
) || 0;


return String(last+1)
.padStart(6,"0");

}

/* =========================
LOAD MEMBERS
========================= */

async function loadMembers(){

async function loadMembers(){

    const list = document.getElementById("memberList");

    if (!list) return;

    const searchInput = document.getElementById("memberSearch");
    const search = searchInput ? searchInput.value.trim() : "";

    list.innerHTML = "<p>⏳ সদস্যের তথ্য লোড হচ্ছে...</p>";

    try {

        let query = supabaseClient
            .from("members")
            .select("*");

        /*
         * created_at না থাকলেও যেন পুরো Panel ভেঙে না যায়।
         * প্রথমে সাধারণভাবে সদস্য আনা হবে।
         */

        const result = await query;

        if (result.error) {

            console.error("Supabase members error:", result.error);

            list.innerHTML =
                "<p>❌ সদস্যের তথ্য লোড হয়নি।</p>" +
                "<p>Supabase error: " +
                escapeHtml(result.error.message) +
                "</p>";

            return;
        }

        let members = result.data || [];

        /*
         * Search
         */

        if (search) {

            const s = search.toLowerCase();

            members = members.filter(function(member){

                return (
                    String(member.member_id || "")
                        .toLowerCase()
                        .includes(s)
                    ||
                    String(member.full_name || "")
                        .toLowerCase()
                        .includes(s)
                    ||
                    String(member.mobile || "")
                        .toLowerCase()
                        .includes(s)
                );

            });

        }

        /*
         * নতুন সদস্য আগে দেখানো
         */

        members.sort(function(a,b){

            const ad =
                a.created_at
                ? new Date(a.created_at).getTime()
                : 0;

            const bd =
                b.created_at
                ? new Date(b.created_at).getTime()
                : 0;

            return bd - ad;

        });


        if (members.length === 0) {

            list.innerHTML =
                "<p>কোনো সদস্য পাওয়া যায়নি।</p>";

            return;
        }


        list.innerHTML = members.map(function(member){

            return `

            <div class="member-item">

                <b>
                    Member ID:
                    ${escapeHtml(member.member_id || "")}
                </b>

                <br><br>

                👤
                ${escapeHtml(member.full_name || "")}

                <br>

                📱
                ${escapeHtml(member.mobile || "")}

                <br><br>

                <button
                    class="primary-btn"
                    onclick="viewMember('${escapeHtml(member.id)}')"
                >
                    👁️ View
                </button>

            </div>

            `;

        }).join("");

    }
    catch(error){

        console.error("Load members failed:", error);

        list.innerHTML =
            "<p>❌ সদস্যের তথ্য লোড করা যাচ্ছে না।</p>";

    }

}

<h3>

/* =========================
DOCUMENT STATUS
========================= */

function docStatus(value){

return value
?
'<span class="ok">✅</span>'
:
'<span class="no">❌</span>';

}



/* =========================
CLOSE VIEW
========================= */

function closeMemberView(){

document
.getElementById("memberViewModal")
.style.display="none";

}



/* =========================
PROFILE
========================= */

function openProfileModal(){

document
.getElementById("profileModal")
.style.display="flex";

}


function closeProfileModal(){

document
.getElementById("profileModal")
.style.display="none";

}


async function saveProfile(){

alert(
"Profile Save এখনো database-এর সাথে সংযুক্ত করা হয়নি।"
);

closeProfileModal();

}



/* =========================
FUND
========================= */

function openBalanceModal(type){

balanceType=type;


document
.getElementById("balanceModal")
.style.display="flex";


document
.getElementById("balanceTitle")
.textContent =
type === "fund_added"
?
"➕ Add Fund"
:
"➖ Reduce Fund";

}


function closeBalanceModal(){

document
.getElementById("balanceModal")
.style.display="none";

}


async function submitBalanceChange(){

const amount =
parseFloat(
document
.getElementById("balanceAmount")
.value
);


if(
!amount ||
amount <= 0
){

alert(
"সঠিক টাকার পরিমাণ দিন।"
);

return;

}


alert(
"Fund Save এখনো database-এর সাথে সংযুক্ত করা হয়নি।"
);

closeBalanceModal();

}



/* =========================
ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
