<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Samity Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f3f6f9;
color:#222;
}

button,input,select{
font:inherit;
}

input,select{
width:100%;
padding:12px;
margin:6px 0 14px;
border:1px solid #ccc;
border-radius:7px;
}

button{
border:0;
border-radius:7px;
padding:11px 16px;
cursor:pointer;
}

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
background:white;
width:95%;
max-width:420px;
padding:30px;
border-radius:15px;
box-shadow:0 5px 25px #0002;
}

.login-box h1{
text-align:center;
}

.login-button{
width:100%;
background:#1769aa;
color:white;
}

.dashboard{
display:none;
}

.header{
background:#1769aa;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 2px 10px #0001;
}

.profile-mini{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
vertical-align:middle;
}

.logout{
background:#d32f2f;
color:white;
}

.primary-btn{
background:#1769aa;
color:white;
}

.secondary-btn{
background:#555;
color:white;
}

.add{
background:#198754;
color:white;
}

.reduce{
background:#dc3545;
color:white;
}

.save{
background:#198754;
color:white;
}

.cancel{
background:#777;
color:white;
}

.delete-btn{
background:#dc3545;
color:white;
}

.action-btn{
background:#1769aa;
color:white;
padding:7px 10px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:9999;
align-items:center;
justify-content:center;
padding:15px;
}

.modal-box{
width:100%;
max-width:650px;
max-height:92vh;
overflow-y:auto;
background:white;
border-radius:12px;
padding:25px;
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.modal-buttons button{
flex:1;
}

.check-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

.check-item{
border:1px solid #ddd;
padding:10px;
border-radius:7px;
}

.check-item input{
width:auto;
margin:0 7px 0 0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

.table-wrap{
overflow-x:auto;
}

.balance{
font-size:28px;
font-weight:bold;
}

.message{
margin:10px 0;
font-weight:bold;
}

.member-info{
background:#f7f7f7;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

@media(max-width:600px){

.header{
flex-direction:column;
gap:10px;
}

}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

type="password"

</div>

</div>


<div class="container">


<!-- PROFILE -->

class="profile-mini"

</div>

<br>

class="add"

<button
class="reduce"

<!-- MEMBERS -->

<div class="card">

<h2>👥 সদস্য</h2>

<button
class="primary-btn"
onclick="openMemberModal()"
>
  <!-- BANKING MODULE MENU -->
<div class="banking-menu">

    <button class="module" onclick="openDashboard()">

    <button class="module" onclick="openAccounts()">

    </button>

    <button class="module" onclick="openSavings()">

    </button>

    <button class="module" onclick="openDPS()">
        📅 DPS

    <button class="module" onclick="openFDR()">
        📜 FDR
    </button>

        💳 Loan
    </button>

    <button class="module" onclick="openEmployees()">
        👨‍💼 Employees
    </button>

    <button class="module" onclick="openApprovals()">
        ✅ Approval
    </button>

    <button class="module" onclick="openFund()">
        💵 Fund
    </button>

    <button class="module" onclick="openReports()">
        📊 Reports
    </button>

    <button class="module" onclick="openReceipts()">
        🧾 Receipts
    </button>

    <button class="module" onclick="openSettings()">
        ⚙️ Settings
    </button>

</div>
➕ নতুন সদস্য
</button>

<button
class="secondary-btn"
onclick="loadMembers()"
>
🔄 Refresh
</button>

<br><br>

<input
type="text"
id="memberSearch"
placeholder="Member ID / নাম / মোবাইল দিয়ে খুঁজুন..."
oninput="loadMembers()"
>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Member ID</th>

<th>নাম</th>

<th>মোবাইল</th>

<th>তারিখ</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="memberList">

<tr>

<td colspan="6">
তথ্য লোড হচ্ছে...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>



<!-- ================= PROFILE MODAL ================= -->

<div id="profileModal" class="modal">

<div class="modal-box">

<h2>👤 Manager Profile</h2>

<img
id="photoPreview"
class="profile-mini"
src="https://placehold.co/200x200"

type="text"

<div class="modal-buttons">

class="cancel"
onclick="closeMemberModal()"
>
Cancel
</button>

</button>

</div>

</div>



<!-- ================= VIEW MEMBER ================= -->

<div id="memberViewModal" class="modal">

<div class="modal-box">

<h2>👤 সদস্যের তথ্য</h2>

<div id="memberDetails"></div>

<div class="modal-buttons">

>
Close

<button

id="deleteMemberButton"
>
🗑️ সদস্য মুছুন
</button>

</div>

</div>

</div>



<script>


/* ==========================================
SUPABASE
========================================== */

const SUPABASE_URL =
"https://tcdilhooslygsvdcqkte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JelXduaAwElDbU0JABTFgg_yLXzPyNx";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser=null;

let currentBalanceAction=null;

let currentViewedMemberId=null;



/* ==========================================
LOGIN
========================================== */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if (!email || !password) {

        message.textContent =
            "❌ Email এবং Password দিন।";

        return;
    }

    message.textContent =
        "⏳ Login হচ্ছে...";

    try {

        const result =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (result.error) {

            message.textContent =
                "❌ Login হয়নি: " +
                result.error.message;

            return;
        }

        currentUser =
            result.data.user;

        message.textContent =
            "✅ Login সফল হয়েছে।";

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "dashboardPage"
        ).style.display = "block";

        if (typeof checkManagerRole === "function") {
            await checkManagerRole();
        }

        if (typeof loadMembers === "function") {
            await loadMembers();
        }

    } catch (error) {

        message.textContent =
            "❌ Login Error: " +
            error.message;
    }

});

</body>
</html>
