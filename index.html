<script>


/* ==========================================
SUPABASE
========================================== */

const SUPABASE_URL =
"https://tcdilhooslygsvdcqkte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JelXduaAwElDbU0JABTFgg_yLXzPyNx";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser=null;

let currentBalanceAction=null;

let currentViewedMemberId=null;



/* ==========================================
LOGIN
========================================== */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

  const message =
document
.getElementById("message");

message.textContent=
"Login হচ্ছে...";


const result =
await supabaseClient.auth
.signInWithPassword({

email:email,

password:password

});


if(result.error){

message.textContent=
"❌ Login ব্যর্থ: "+
result.error.message;

return;

}


currentUser =
result.data.user;

await showDashboard();

});



/* ==========================================
SESSION
========================================== */

async function checkSession(){

const result =
await supabaseClient.auth.getSession();

if(
result.data &&
result.data.session
){

currentUser =
result.data.session.user;

await showDashboard();

}

}

checkSession();



/* ==========================================
SHOW DASHBOARD
========================================== */

async function showDashboard(){

document
.getElementById("loginPage")
.style.display="none";

document
.getElementById("dashboardPage")
.style.display="block";


await loadManagerProfile();

await loadMembers();

}



/* ==========================================
LOGOUT
========================================== */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

document
.getElementById("dashboardPage")
.style.display="none";

document
.getElementById("loginPage")
.style.display="flex";

document
.getElementById("password")
.value="";

}



/* ==========================================
MANAGER PROFILE
========================================== */

async function loadManagerProfile(){

if(!currentUser)return;


const result =
await supabaseClient
.from("manager_profiles")
.select("*")
.eq(
"user_id",
currentUser.id
)
.maybeSingle();


if(result.error){

console.log(
"Profile:",
result.error.message
);

return;

}


if(!result.data){

document
.getElementById("managerName")
.textContent=
"Manager";

return;

}


const p=result.data;


document
.getElementById("managerName")
.textContent=
p.full_name ||
"Manager";


document
.getElementById("managerMobile")
.textContent=
p.mobile
?
"Mobile: "+p.mobile
:
"";


if(p.photo_url){

document
.getElementById("profilePhoto")
.src=p.photo_url;

document
.getElementById("miniPhoto")
.src=p.photo_url;

}

}



function openProfileModal(){

document
.getElementById("profileModal")
.style.display="flex";

loadManagerProfileForEdit();

}



async function loadManagerProfileForEdit(){

if(!currentUser)return;


const result =
await supabaseClient
.from("manager_profiles")
.select("*")
.eq(
"user_id",
currentUser.id
)
.maybeSingle();


if(result.data){

document
.getElementById("profileName")
.value=
result.data.full_name ||
"";

document
.getElementById("profileMobile")
.value=
result.data.mobile ||
"";

document
.getElementById("photoPreview")
.src=
result.data.photo_url ||
"https://placehold.co/200x200";

}

}



function closeProfileModal(){

document
.getElementById("profileModal")
.style.display="none";

}



async function saveProfile(){

const name =
document
.getElementById("profileName")
.value
.trim();

const mobile =
document
.getElementById("profileMobile")
.value
.trim();

const message =
document
.getElementById("profileMessage");


if(!name){

message.textContent=
"Manager-এর নাম লিখুন।";

return;

}


const result =
await supabaseClient
.from("manager_profiles")
.upsert({

user_id:
currentUser.id,

full_name:
name,

mobile:
mobile,

updated_at:
new Date().toISOString()

},{
onConflict:"user_id"
});


if(result.error){

message.textContent=
"❌ "+
result.error.message;

return;

}


message.textContent=
"✅ Profile saved.";

await loadManagerProfile();

setTimeout(
closeProfileModal,
700
);

}



/* ==========================================
FUND
========================================== */

function openBalanceModal(action){

currentBalanceAction=action;

document
.getElementById("balanceModal")
.style.display="flex";


document
.getElementById("modalTitle")
.textContent=
action==="fund_added"
?
"➕ Add Fund"
:
"➖ Reduce Fund";


document
.getElementById("balanceAmount")
.value="";

document
.getElementById("balanceDescription")
.value="";

}



function closeBalanceModal(){

document
.getElementById("balanceModal")
.style.display="none";

}



async function submitBalanceChange(){

const amount =
Number(
document
.getElementById("balanceAmount")
.value
);

const description =
document
.getElementById("balanceDescription")
.value
.trim();

const message =
document
.getElementById("balanceMessage");


if(!amount || amount<=0){

message.textContent=
"সঠিক টাকার পরিমাণ দিন।";

return;

}


const result =
await supabaseClient
.from("manager_fund_ledger")
.insert({

manager_id:
currentUser.id,

transaction_type:
currentBalanceAction,

amount:amount,

description:
description || null

});


if(result.error){

message.textContent=
"❌ "+
result.error.message;

return;

}


message.textContent=
"✅ সফল হয়েছে।";


setTimeout(
closeBalanceModal,
800
);

}



/* ==========================================
GENERATE MEMBER ID
========================================== */

async function generateMemberId(){

const result =
await supabaseClient
.from("members")
.select("member_id")
.order(
"member_id",
{
ascending:false
}
)
.limit(1);


if(
result.error ||
!result.data ||
result.data.length===0
){

return "000001";

}


const last =
parseInt(
result.data[0].member_id,
10
)||0;


return String(
last+1
)
.padStart(
6,
"0"
);

}



/* ==========================================
OPEN MEMBER
========================================== */

async function openMemberModal(){

document
.getElementById("memberModal")
.style.display="flex";


document
.getElementById("memberMessage")
.textContent="";


document
.getElementById("memberJoinDate")
.value=
new Date()
.toISOString()
.split("T")[0];


document
.getElementById("newMemberId")
.value=
await generateMemberId();

}



function closeMemberModal(){

document
.getElementById("memberModal")
.style.display="none";

}



/* ==========================================
SAVE MEMBER
========================================== */

/* =========================
   MEMBER SYSTEM
========================= */

async function saveMember(){

    const msg = document.getElementById("memberMessage");

    const memberId =
        document.getElementById("newMemberId").value.trim();

    const fullName =
        document.getElementById("memberName").value.trim();

    const father =
        document.getElementById("fatherName").value.trim();

    const mobile =
        document.getElementById("memberMobile").value.trim();

    const nid =
        document.getElementById("memberNid").value.trim();

    const addressEl =
        document.getElementById("memberAddress");

    const address =
        addressEl ? addressEl.value.trim() : "";

    const joinDate =
        document.getElementById("memberJoinDate").value;

    const statusEl =
        document.getElementById("memberStatus");

    const status =
        statusEl ? statusEl.value : "active";

    if(!fullName){

        msg.textContent =
            "❌ সদস্যের নাম লিখুন।";

        return;
    }

    if(!memberId){

        msg.textContent =
            "❌ Member ID পাওয়া যায়নি।";

        return;
    }

    msg.textContent =
        "⏳ সদস্য সংরক্ষণ হচ্ছে...";

    const result =
        await supabaseClient
        .from("members")
        .insert({

            member_id: memberId,

            member_no: memberId,

            full_name: fullName,

            father_husband_name: father,

            mobile: mobile,

            nid: nid,

            address: address,

            join_date:
                joinDate || null,

            status: status

        })
        .select()
        .single();

    if(result.error){

        msg.textContent =
            "❌ সদস্য সংরক্ষণ হয়নি: " +
            result.error.message;

        return;
    }

    msg.textContent =
        "✅ সদস্য সফলভাবে যোগ হয়েছে।";

    await loadMembers();

    setTimeout(function(){

        closeMemberModal();

    },800);
}


/* =========================
   LOAD MEMBERS
========================= */

async function loadMembers(){

    const tbody =
        document.getElementById("memberList");

    if(!tbody) return;

    const search =
        document.getElementById("memberSearch")
        ?.value.trim()
        .toLowerCase() || "";

    const result =
        await supabaseClient
        .from("members")
        .select("*")
        .order("created_at",{ascending:false});

    if(result.error){

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    ❌ তথ্য লোড হয়নি:
                    ${escapeHtml(result.error.message)}
                </td>
            </tr>
        `;

        return;
    }

    let members =
        result.data || [];

    if(search){

        members =
            members.filter(function(m){

                return (

                    String(m.member_id || "")
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(m.member_no || "")
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(m.full_name || "")
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(m.mobile || "")
                    .toLowerCase()
                    .includes(search)

                );

            });
    }

    if(members.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    কোনো সদস্য পাওয়া যায়নি।
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML =
        members.map(function(m){

            return `

            <tr>

                <td>
                    ${escapeHtml(
                        m.member_id ||
                        m.member_no ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        m.full_name || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        m.mobile || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        m.join_date || ""
                    )}
                </td>

                <td>
                    ${m.status === "active"
                        ? "🟢 Active"
                        : "🔴 Inactive"}
                </td>

                <td>

                    <button
                        class="action-btn"
                        onclick="viewMember('${m.id}')"
                    >
                        👁️ View
                    </button>

                </td>

            </tr>

            `;

        }).join("");
}


/* =========================
   VIEW MEMBER
========================= */

async function viewMember(id){

    const result =
        await supabaseClient
        .from("members")
        .select("*")
        .eq("id",id)
        .single();

    if(result.error){

        alert(
            "সদস্যের তথ্য পাওয়া যায়নি।"
        );

        return;
    }

    const m =
        result.data;

    const details =
        document.getElementById(
            "memberDetails"
        );

    if(!details) return;

    details.innerHTML = `

        <h3>👤 সদস্যের তথ্য</h3>

        <p>
            <b>Member ID:</b>
            ${escapeHtml(
                m.member_id ||
                m.member_no ||
                ""
            )}
        </p>

        <p>
            <b>নাম:</b>
            ${escapeHtml(
                m.full_name || ""
            )}
        </p>

        <p>
            <b>পিতা/স্বামী:</b>
            ${escapeHtml(
                m.father_husband_name || ""
            )}
        </p>

        <p>
            <b>মোবাইল:</b>
            ${escapeHtml(
                m.mobile || ""
            )}
        </p>

        <p>
            <b>NID:</b>
            ${escapeHtml(
                m.nid || ""
            )}
        </p>

        <p>
            <b>ঠিকানা:</b>
            ${escapeHtml(
                m.address || ""
            )}
        </p>

        <p>
            <b>যোগদানের তারিখ:</b>
            ${escapeHtml(
                m.join_date || ""
            )}
        </p>

        <p>
            <b>Status:</b>
            ${escapeHtml(
                m.status || ""
            )}
        </p>

        <br>

        <button
            class="save"
            onclick="editMember('${m.id}')"
        >
            ✏️ Edit
        </button>

        >

        </button>

    `;

    document.getElementById(

    ).style.display = "flex";

/* =========================
   EDIT MEMBER
========================= */

async function editMember(id){

    const result =
        await supabaseClient
        .from("members")
        .select("*")
        .eq("id",id)
        .single();

    if(result.error){

        alert(
            "সদস্যের তথ্য পাওয়া যায়নি।"
        );

        return;
    }

    const m =
        result.data;

    document.getElementById(
        "memberViewModal"
    ).style.display = "none";

    document.getElementById(
        "memberModal"
    ).style.display = "flex";

    document.getElementById(
        "newMemberId"
    ).value =
        m.member_id ||
        m.member_no ||
        "";

    document.getElementById(
        "memberName"
    ).value =
        m.full_name || "";

    document.getElementById(
        "fatherName"
    ).value =
        m.father_husband_name || "";

    document.getElementById(
        "memberMobile"
    ).value =
        m.mobile || "";

    document.getElementById(
        "memberNid"
    ).value =
        m.nid || "";

    if(document.getElementById(
        "memberAddress"
    )){

        document.getElementById(
            "memberAddress"
        ).value =
            m.address || "";
    }

    document.getElementById(
        "memberJoinDate"
    ).value =
        m.join_date || "";

    if(document.getElementById(
        "memberStatus"
    )){

        document.getElementById(
            "memberStatus"
        ).value =
            m.status || "active";
    }

    const button =
        document.querySelector(
            '#memberModal button[onclick="saveMember()"]'
        );

    if(button){

        button.textContent =
            "💾 Update Member";

        button.onclick =
            function(){

                updateMember(id);

            };
    }
}


/* =========================
   UPDATE MEMBER
========================= */

async function updateMember(id){

    const msg =
        document.getElementById(
            "memberMessage"
        );

    const fullName =
        document.getElementById(
            "memberName"
        ).value.trim();

    const father =
        document.getElementById(
            "fatherName"
        ).value.trim();

    const mobile =
        document.getElementById(
            "memberMobile"
        ).value.trim();

    const nid =
        document.getElementById(
            "memberNid"
        ).value.trim();

    const address =
        document.getElementById(
            "memberAddress"
        )?.value.trim() || "";

    const joinDate =
        document.getElementById(
            "memberJoinDate"
        ).value;

    const status =
        document.getElementById(
            "memberStatus"
        )?.value || "active";

    if(!fullName){

        msg.textContent =
            "❌ সদস্যের নাম লিখুন।";

        return;
    }

    msg.textContent =
        "⏳ তথ্য আপডেট হচ্ছে...";

    const result =
        await supabaseClient
        .from("members")
        .update({

            full_name: fullName,

            father_husband_name: father,

            mobile: mobile,

            nid: nid,

            address: address,

            join_date:
                joinDate || null,

            status: status

        })
        .eq("id",id);

    if(result.error){

        msg.textContent =
            "❌ আপডেট হয়নি: " +
            result.error.message;

        return;
    }

    msg.textContent =
        "✅ সদস্যের তথ্য আপডেট হয়েছে।";

    await loadMembers();

    setTimeout(function(){

        closeMemberModal();

    },800);
}


/* =========================
   DELETE MEMBER
========================= */

async function deleteMember(id){

    const confirmDelete =
        confirm(
            "⚠️ এই সদস্যকে মুছে ফেলতে চান?"
        );

    if(!confirmDelete){

        return;
    }

    const result =
        await supabaseClient
        .from("members")
        .delete()
        .eq("id",id);

    if(result.error){

        alert(
            "❌ সদস্য মুছে ফেলা যায়নি:\n\n" +
            result.error.message
        );

        return;
    }

    alert(
        "✅ সদস্য সফলভাবে মুছে ফেলা হয়েছে।"
    );

    closeMemberView();

    await loadMembers();
}


/* =========================
   CLOSE MEMBER VIEW
========================= */

function closeMemberView(){

    const modal =
        document.getElementById(
            "memberViewModal"
        );

    if(modal){

        modal.style.display =
            "none";
    }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
