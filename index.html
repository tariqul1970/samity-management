<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সমবায় ব্যবস্থাপনা</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    .login-box h1 {
      text-align: center;
      color: #123b5d;
      margin-bottom: 5px;
    }

    .login-box p {
      text-align: center;
      color: #777;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #1261a0;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .login-button {
      width: 100%;
      margin-top: 20px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* DASHBOARD */

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      background: #123b5d;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
    }

    .profile-mini {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 2px solid white;
    }

    .logout {
      background: #d9534f;
    }

    .content {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    /* PROFILE */

    .profile-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .profile-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      border: 4px solid #1261a0;
    }

    .profile-info h2 {
      margin: 0 0 8px;
    }

    .profile-info p {
      margin: 5px 0;
      color: #666;
    }

    /* BALANCE */

    .balance-card {
      background: #1261a0;
      color: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }

    .balance-title {
      font-size: 17px;
      opacity: .9;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0 20px;
    }

    .balance-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .balance-buttons button {
      background: white;
      color: #1261a0;
    }

    /* MODULES */

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h3 {
      margin-top: 0;
      color: #123b5d;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .cancel {
      background: #777;
    }

    /* MOBILE */

    @media(max-width:600px) {

      .profile-card {
        flex-direction: column;
        text-align: center;
      }

      .topbar h2 {
        font-size: 16px;
      }

      .balance {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page" id="loginPage">

  <div class="login-box">

    <h1>সমবায় ব্যবস্থাপনা</h1>

    <p>Manager Login</p>

    <form id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Manager Email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button
        class="login-button"
        type="submit"
      >
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard" id="dashboard">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="topbar-left">

      <img
        id="miniPhoto"
        class="profile-mini"
        src="https://placehold.co/100x100"
        alt="Manager"
      >

      <h2>Manager Dashboard</h2>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="content">

    <!-- PROFILE -->

    <div class="profile-card">

      <img
        id="profilePhoto"
        class="profile-photo"
        src="https://placehold.co/200x200"
        alt="Manager Photo"
      >

      <div class="profile-info">

        <h2 id="managerName">
          Manager
        </h2>

        <p>
          👤 Manager
        </p>

        <p id="managerMobile">
          Mobile: —
        </p>

      </div>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

      <div class="balance-title">
        💰 Available Balance
      </div>

      <div
        class="balance"
        id="balance"
      >
        ৳0.00
      </div>

      <div class="balance-buttons">

        <button
          onclick="openBalanceModal('fund_added')"
        >
          ➕ Add Fund
        </button>

        <button
          onclick="openBalanceModal('fund_reduced')"
        >
          ➖ Reduce Fund
        </button>

      </div>

    </div>


    <!-- SYSTEM MODULES -->

    <div class="cards">

      <div class="card">
        <h3>👥 Members</h3>
        <p>সদস্য ব্যবস্থাপনা</p>
      </div>

      <div class="card">
        <h3>💳 Savings</h3>
        <p>সঞ্চয় হিসাব</p>
      </div>

      <div class="card">
        <h3>📅 DPS</h3>
        <p>DPS ব্যবস্থাপনা</p>
      </div>

      <div class="card">
        <h3>🏦 FDR</h3>
        <p>FDR ব্যবস্থাপনা</p>
      </div>

      <div class="card">
        <h3>💰 Loan</h3>
        <p>Loan ব্যবস্থাপনা</p>
      </div>

      <div class="card">
        <h3>👨‍💼 Staff</h3>
        <p>Field Officer ও Staff</p>
      </div>

    </div>

  </div>

</div>


<!-- =========================
     BALANCE MODAL
========================= -->

<div
  class="modal"
  id="balanceModal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Fund
    </h2>

    <label>
      Amount
    </label>

    <input
      type="number"
      id="balanceAmount"
      min="1"
      step="0.01"
      placeholder="টাকার পরিমাণ"
    >

    <label>
      Description
    </label>

    <input
      type="text"
      id="balanceDescription"
      placeholder="কারণ লিখুন"
    >

    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeBalanceModal()"
      >
        Cancel
      </button>

      <button
        onclick="submitBalanceChange()"
      >
        Save
      </button>

    </div>

    <div
      id="balanceMessage"
      style="margin-top:15px;text-align:center"
    ></div>

  </div>

</div>


<script>

// ======================================
// SUPABASE CONNECTION
// ======================================

const SUPABASE_URL =
  "https://tcdilhooslygsvdcqkte.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JelXduaAwElDbU0JABTFgg_yLXzPyNx";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ======================================
// LOGIN
// ======================================

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const message =
      document.getElementById("message");

    message.style.color = "#333";

    message.textContent =
      "Login হচ্ছে...";


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.style.color = "red";

      message.textContent =
        "Login failed: " +
        error.message;

      return;
    }


    const user = data.user;


    // Check user role

    const {
      data: roleData,
      error: roleError
    } =
      await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .single();


    if (roleError || !roleData) {

      await supabaseClient.auth.signOut();

      message.style.color = "red";

      message.textContent =
        "এই User-এর কোনো role পাওয়া যায়নি।";

      return;
    }


    if (roleData.role !== "manager") {

      await supabaseClient.auth.signOut();

      message.style.color = "red";

      message.textContent =
        "শুধু Manager Login করতে পারবেন।";

      return;
    }


    // Show Dashboard

    document
      .getElementById("loginPage")
      .style.display = "none";

    document
      .getElementById("dashboard")
      .style.display = "block";


    await loadManagerProfile();

  });


// ======================================
// LOAD MANAGER PROFILE
// ======================================

async function loadManagerProfile() {

  const {
    data: userData
  } =
    await supabaseClient.auth.getUser();


  if (!userData.user) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("manager_profiles")
      .select("*")
      .eq("user_id", userData.user.id)
      .single();


  if (error) {

    console.error(error);

    alert(
      "Manager Profile পাওয়া যায়নি: " +
      error.message
    );

    return;
  }


  document
    .getElementById("managerName")
    .textContent =
      data.full_name;


  document
    .getElementById("balance")
    .textContent =
      "৳" +
      Number(data.balance)
        .toLocaleString("en-BD", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });


  document
    .getElementById("managerMobile")
    .textContent =
      "Mobile: " +
      (data.mobile || "—");


  if (data.profile_photo_url) {

    document
      .getElementById("profilePhoto")
      .src =
        data.profile_photo_url;

    document
      .getElementById("miniPhoto")
      .src =
        data.profile_photo_url;
  }

}


// ======================================
// BALANCE MODAL
// ======================================

let currentTransactionType =
  "fund_added";


function openBalanceModal(type) {

  currentTransactionType = type;


  document
    .getElementById("balanceModal")
    .style.display = "flex";


  document
    .getElementById("balanceAmount")
    .value = "";


  document
    .getElementById("balanceDescription")
    .value = "";


  document
    .getElementById("balanceMessage")
    .textContent = "";


  if (type === "fund_added") {

    document
      .getElementById("modalTitle")
      .textContent =
        "➕ Add Fund";

  } else {

    document
      .getElementById("modalTitle")
      .textContent =
        "➖ Reduce Fund";
  }

}


// ======================================
// CLOSE MODAL
// ======================================

function closeBalanceModal() {

  document
    .getElementById("balanceModal")
    .style.display = "none";

}


// ======================================
// CHANGE BALANCE
// ======================================

async function submitBalanceChange() {

  const amount =
    Number(
      document
        .getElementById("balanceAmount")
        .value
    );


  const description =
    document
      .getElementById("balanceDescription")
      .value
      .trim();


  const message =
    document
      .getElementById("balanceMessage");


  if (!amount || amount <= 0) {

    message.style.color = "red";

    message.textContent =
      "সঠিক Amount দিন।";

    return;
  }


  message.style.color = "#333";

  message.textContent =
    "Processing...";


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "change_manager_balance",
      {
        p_amount: amount,

        p_transaction_type:
          currentTransactionType,

        p_description:
          description || null
      }
    );


  if (error) {

    message.style.color = "red";

    message.textContent =
      error.message;

    return;
  }


  message.style.color = "green";

  message.textContent =
    "Balance সফলভাবে পরিবর্তন হয়েছে।";


  document
    .getElementById("balance")
    .textContent =
      "৳" +
      Number(data)
        .toLocaleString("en-BD", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });


  setTimeout(
    closeBalanceModal,
    1000
  );

}


// ======================================
// LOGOUT
// ======================================

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById("dashboard")
    .style.display = "none";


  document
    .getElementById("loginPage")
    .style.display = "flex";


  document
    .getElementById("message")
    .textContent = "";

}

</script>

</body>
</html>
