<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সমবায় সমিতি ম্যানেজমেন্ট</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f6f8;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:6px 0 12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    padding:11px 16px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    margin:3px;
}

.primary-btn,.save,.login-button{
    background:#1769aa;
    color:#fff;
}

.cancel{
    background:#ddd;
}

.logout{
    background:#d32f2f;
    color:#fff;
}

.add{
    background:#2e7d32;
    color:#fff;
}

.reduce{
    background:#c62828;
    color:#fff;
}

.secondary-btn{
    background:#555;
    color:#fff;
}

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    width:95%;
    max-width:400px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 3px 20px #ccc;
}

.dashboard{
    display:none;
}

.topbar{
    background:#fff;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    border-radius:10px;
    margin-bottom:20px;
}

.profile-mini{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    vertical-align:middle;
}

.profile-photo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:999;
}

.modal-content{
    background:#fff;
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow:auto;
    padding:25px;
    border-radius:15px;
}

.document-section{
    background:#f8f8f8;
    border:1px solid #ddd;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.check-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin:5px 0;
    background:#fff;
    border:1px solid #eee;
    border-radius:7px;
}

.check-row input{
    width:20px;
    height:20px;
    margin:0;
}

.form-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

.member-item{
    background:#fff;
    padding:15px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

.ok{
    color:green;
    font-weight:bold;
}

.no{
    color:red;
    font-weight:bold;
}

.message{
    margin:10px 0;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-page">

<div class="login-box">

<h2>🔐 Manager Login</h2>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Manager Email"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button
class="login-button"
type="submit"
style="width:100%"
>
Login
</button>

</form>

<div id="loginMessage" class="message"></div>

</div>
</div>


<!-- DASHBOARD -->

<div id="dashboardPage" class="dashboard">

<div class="container">

<div class="topbar">

<div>

<img
id="miniPhoto"
class="profile-mini"
src="https://placehold.co/100x100"
alt="Manager"
>

<b id="managerName">Manager</b>

</div>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

</div>


<!-- MANAGER -->

<div class="card">

<h2>👤 Manager Profile</h2>

<img
id="profilePhoto"
class="profile-photo"
src="https://placehold.co/200x200"
alt="Manager"
>

<br><br>

<button
class="primary-btn"
onclick="openProfileModal()"
>
✏️ Edit Profile
</button>

</div>


<!-- FUND -->

<div class="card">

<h2>💰 Fund</h2>

<div class="actions">

<button
class="add"
onclick="openBalanceModal('fund_added')"
>
➕ Add Fund
</button>

<button
class="reduce"
onclick="openBalanceModal('fund_reduced')"
>
➖ Reduce Fund
</button>

</div>

</div>


<!-- MEMBERS -->

<div class="card">

<h2>👥 সদস্য</h2>

<button
class="primary-btn"
onclick="openMemberModal()"
>
➕ নতুন সদস্য
</button>

<input
type="text"
id="memberSearch"
placeholder="Member ID / নাম / মোবাইল দিয়ে খুঁজুন..."
oninput="loadMembers()"
>

<button
class="secondary-btn"
onclick="loadMembers()"
>
🔄 Refresh
</button>

<div id="memberList"></div>

</div>

</div>
</div>


<!-- PROFILE MODAL -->

<div id="profileModal" class="modal">

<div class="modal-content">

<h2>👤 Manager Profile</h2>

<img
id="photoPreview"
class="profile-photo"
style="display:block;margin:10px auto 20px"
src="https://placehold.co/200x200"
>

<input
type="text"
id="profileName"
placeholder="Manager-এর নাম"
>

<input
type="tel"
id="profileMobile"
placeholder="01XXXXXXXXX"
>

<input
type="file"
id="profilePhotoFile"
accept="image/*"
>

<div class="form-buttons">

<button
class="cancel"
onclick="closeProfileModal()"
>
Cancel
</button>

<button
class="save"
onclick="saveProfile()"
>
💾 Save
</button>

</div>

</div>
</div>


<!-- FUND MODAL -->

<div id="balanceModal" class="modal">

<div class="modal-content">

<h2 id="balanceTitle">Fund</h2>

<input
type="number"
id="balanceAmount"
min="1"
step="0.01"
placeholder="টাকার পরিমাণ"
>

<input
type="text"
id="balanceDescription"
placeholder="কারণ লিখুন"
>

<div class="form-buttons">

<button
class="cancel"
onclick="closeBalanceModal()"
>
Cancel
</button>

<button
class="save"
onclick="submitBalanceChange()"
>
💾 Save
</button>

</div>

</div>
</div>


<!-- MEMBER MODAL -->

<div id="memberModal" class="modal">

<div class="modal-content">

<h2>➕ নতুন সদস্য</h2>

<input
type="text"
id="newMemberId"
readonly
placeholder="Auto Generate"
>

<input
type="text"
id="memberName"
placeholder="পূর্ণ নাম"
>

<input
type="text"
id="fatherName"
placeholder="পিতা/স্বামীর নাম"
>

<input
type="tel"
id="memberMobile"
placeholder="01XXXXXXXXX"
>

<input
type="text"
id="memberNid"
placeholder="NID"
>

<input
type="text"
id="memberAddress"
placeholder="ঠিকানা"
>

<input
type="date"
id="memberJoinDate"
>

<select id="memberStatus">
<option value="active">Active</option>
<option value="inactive">Inactive</option>
</select>


<!-- DOCUMENT CHECKLIST -->

<div class="document-section">

<h3>📁 ডকুমেন্ট চেকলিস্ট</h3>

<div class="check-row">
<input type="checkbox" id="photoTaken">
<label for="photoTaken">🖼️ ছবি</label>
</div>

<div class="check-row">
<input type="checkbox" id="signatureTaken">
<label for="signatureTaken">✍️ স্বাক্ষর</label>
</div>

<div class="check-row">
<input type="checkbox" id="nidTaken">
<label for="nidTaken">🪪 NID</label>
</div>

<div class="check-row">
<input type="checkbox" id="chequeTaken">
<label for="chequeTaken">🧾 চেক</label>
</div>

<input
type="number"
id="chequePages"
min="0"
placeholder="চেকের পাতা সংখ্যা"
>

<div class="check-row">
<input type="checkbox" id="nomineeFormTaken">
<label for="nomineeFormTaken">📋 নমিনি ফরম</label>
</div>

<div class="check-row">
<input type="checkbox" id="deedTaken">
<label for="deedTaken">📄 দলিল</label>
</div>

<div class="check-row">
<input type="checkbox" id="porchaTaken">
<label for="porchaTaken">📑 পর্চা</label>
</div>

<div class="check-row">
<input type="checkbox" id="otherDocumentTaken">
<label for="otherDocumentTaken">📂 অন্যান্য</label>
</div>

<input
type="text"
id="otherDocumentDetails"
placeholder="অন্যান্য ডকুমেন্টের বিবরণ"
>

<input
type="text"
id="documentFolder"
placeholder="ফোল্ডারের অবস্থান যেমন: D:\Samity Documents\000001"
>

<textarea
id="documentNote"
rows="3"
placeholder="ডকুমেন্ট সংক্রান্ত মন্তব্য"
></textarea>

</div>

<div
id="memberMessage"
class="message"
></div>

<div class="form-buttons">

<button
class="cancel"
onclick="closeMemberModal()"
>
Cancel
</button>

<button
class="save"
onclick="saveMember()"
>
💾 Save Member
</button>

</div>

</div>
</div>


<!-- MEMBER VIEW -->

<div id="memberViewModal" class="modal">

<div class="modal-content">

<h2>👤 সদস্যের তথ্য</h2>

<div id="memberDetails"></div>

<div class="form-buttons">

<button
class="cancel"
onclick="closeMemberView()"
>
Close
</button>

</div>

</div>
</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://tcdilhooslygsvdcqkte.supabase.co";

/*
এখানে তোমার আগের Supabase
Publishable Key বসাবে
*/

const SUPABASE_KEY =
"তোমার আগের Publishable Key এখানে বসাও";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser=null;
let balanceType=null;


/* =========================
LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

const msg=
document.getElementById("loginMessage");

msg.textContent="Login হচ্ছে...";

const result=
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});

if(result.error){

msg.textContent=
"Login ব্যর্থ: "+
result.error.message;

return;

}

currentUser=result.data.user;

document
.getElementById("loginPage")
.style.display="none";

document
.getElementById("dashboardPage")
.style.display="block";

await loadMembers();

});


/* =========================
SESSION
========================= */

async function checkSession(){

const result=
await supabaseClient.auth.getSession();

if(
result.data &&
result.data.session &&
result.data.session.user
){

currentUser=
result.data.session.user;

document
.getElementById("loginPage")
.style.display="none";

document
.getElementById("dashboardPage")
.style.display="block";

await loadMembers();

}

}


/* =========================
LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

document
.getElementById("dashboardPage")
.style.display="none";

document
.getElementById("loginPage")
.style.display="flex";

document
.getElementById("password")
.value="";

}


/* =========================
MEMBER ID
========================= */

async function generateMemberId(){

const result=
await supabaseClient
.from("members")
.select("member_id")
.order("member_id",{ascending:false})
.limit(1);

if(
result.error ||
!result.data ||
result.data.length===0
){

return "000001";

}

const last=
parseInt(
result.data[0].member_id,
10
)||0;

return String(last+1)
.padStart(6,"0");

}


/* =========================
OPEN MEMBER
========================= */

async function openMemberModal(){

document
.getElementById("memberModal")
.style.display="flex";

document
.getElementById("newMemberId")
.value=
await generateMemberId();

document
.getElementById("memberJoinDate")
.value=
new Date()
.toISOString()
.split("T")[0];

}


/* =========================
CLOSE MEMBER
========================= */

function closeMemberModal(){

document
.getElementById("memberModal")
.style.display="none";

}


/* =========================
SAVE MEMBER
========================= */

async function saveMember(){

const msg=
document.getElementById("memberMessage");

const memberId=
document.getElementById("newMemberId")
.value;

const fullName=
document.getElementById("memberName")
.value.trim();

const father=
document.getElementById("fatherName")
.value.trim();

const mobile=
document.getElementById("memberMobile")
.value.trim();

const nid=
document.getElementById("memberNid")
.value.trim();

const address=
document.getElementById("memberAddress")
.value.trim();

const joinDate=
document.getElementById("memberJoinDate")
.value;

const status=
document.getElementById("memberStatus")
.value;


/* DOCUMENTS */

const photoTaken=
document.getElementById("photoTaken")
.checked;

const signatureTaken=
document.getElementById("signatureTaken")
.checked;

const nidTaken=
document.getElementById("nidTaken")
.checked;

const chequeTaken=
document.getElementById("chequeTaken")
.checked;

const chequePages=
parseInt(
document.getElementById("chequePages")
.value||"0",
10
)||0;

const nomineeFormTaken=
document.getElementById("nomineeFormTaken")
.checked;

const deedTaken=
document.getElementById("deedTaken")
.checked;

const porchaTaken=
document.getElementById("porchaTaken")
.checked;

const otherDocumentTaken=
document.getElementById("otherDocumentTaken")
.checked;

const otherDocumentDetails=
document.getElementById("otherDocumentDetails")
.value.trim();

const documentFolder=
document.getElementById("documentFolder")
.value.trim();

const documentNote=
document.getElementById("documentNote")
.value.trim();


if(!fullName){

msg.textContent=
"সদস্যের নাম লিখুন।";

return;

}

msg.textContent=
"সদস্য সংরক্ষণ হচ্ছে...";


const result=
await supabaseClient
.from("members")
.insert({

member_id:memberId,

full_name:fullName,

father_husband_name:father,

mobile:mobile,

nid:nid,

address:address,

join_date:joinDate||null,

status:status,

photo_taken:photoTaken,

signature_taken:signatureTaken,

nid_taken:nidTaken,

cheque_taken:chequeTaken,

cheque_pages:chequePages,

nominee_form_taken:
nomineeFormTaken,

deed_taken:deedTaken,

porcha_taken:porchaTaken,

other_document_taken:
otherDocumentTaken,

other_document_details:
otherDocumentDetails,

document_folder:
documentFolder,

document_note:
documentNote

})
.select()
.single();


if(result.error){

msg.textContent=
"❌ সদস্য সংরক্ষণ হয়নি: "+
result.error.message;

console.error(result.error);

return;

}


msg.textContent=
"✅ সদস্য সফলভাবে যোগ হয়েছে। Member ID: "+
memberId;

await loadMembers();

setTimeout(
closeMemberModal,
1000
);

}


/* =========================
LOAD MEMBERS
========================= */

async function loadMembers(){

const list=
document.getElementById("memberList");

const search=
document
.getElementById("memberSearch")
.value.trim();


let query=
supabaseClient
.from("members")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(search){

query=
query.or(
"member_id.ilike.%"+
search+
"%,"+
"full_name.ilike.%"+
search+
"%,"+
"mobile.ilike.%"+
search+
"%"
);

}


const result=
await query;


if(result.error){

list.innerHTML=
"<p>❌ তথ্য লোড হয়নি: "+
escapeHtml(
result.error.message
)+
"</p>";

return;

}


if(
!result.data ||
result.data.length===0
){

list.innerHTML=
"<p>কোনো সদস্য পাওয়া যায়নি।</p>";

return;

}


list.innerHTML=
result.data
.map(member=>`

<div class="member-item">

<b>
Member ID:
${escapeHtml(member.member_id)}
</b>

<br>

👤
${escapeHtml(member.full_name)}

<br>

📱
${escapeHtml(member.mobile||"")}

<br><br>

<button
class="primary-btn"
onclick="viewMember('${member.id}')"
>
👁️ View
</button>

</div>

`)
.join("");

}


/* =========================
VIEW MEMBER
========================= */

async function viewMember(id){

const result=
await supabaseClient
.from("members")
.select("*")
.eq("id",id)
.single();


if(result.error){

alert(
"সদস্যের তথ্য পাওয়া যায়নি।"
);

return;

}


const m=result.data;


document
.getElementById("memberDetails")
.innerHTML=`

<p>
<b>Member ID:</b>
${escapeHtml(m.member_id)}
</p>

<p>
<b>নাম:</b>
${escapeHtml(m.full_name)}
</p>

<p>
<b>পিতা/স্বামী:</b>
${escapeHtml(
m.father_husband_name||""
)}
</p>

<p>
<b>মোবাইল:</b>
${escapeHtml(m.mobile||"")}
</p>

<p>
<b>NID:</b>
${escapeHtml(m.nid||"")}
</p>

<p>
<b>ঠিকানা:</b>
${escapeHtml(m.address||"")}
</p>

<hr>

<h3>
📁 ডকুমেন্ট চেকলিস্ট
</h3>

<p>
${docStatus(m.photo_taken)}
🖼️ ছবি
</p>

<p>
${docStatus(m.signature_taken)}
✍️ স্বাক্ষর
</p>

<p>
${docStatus(m.nid_taken)}
🪪 NID
</p>

<p>
${docStatus(m.cheque_taken)}
🧾 চেক
${m.cheque_taken?
"("+(
m.cheque_pages||0
)+" পাতা)"
:""}
</p>

<p>
${docStatus(
m.nominee_form_taken
)}
📋 নমিনি ফরম
</p>

<p>
${docStatus(m.deed_taken)}
📄 দলিল
</p>

<p>
${docStatus(m.porcha_taken)}
📑 পর্চা
</p>

<p>
${docStatus(
m.other_document_taken
)}
📂 অন্যান্য
</p>

${
m.other_document_details
?
"<p><b>অন্যান্য:</b> "+
escapeHtml(
m.other_document_details
)+
"</p>"
:""
}

<hr>

<p>
<b>📁 Folder:</b><br>
${escapeHtml(
m.document_folder||
"দেওয়া হয়নি"
)}
</p>

<p>
<b>📝 মন্তব্য:</b><br>
${escapeHtml(
m.document_note||""
)}
</p>

`;


document
.getElementById("memberViewModal")
.style.display="flex";

}


/* =========================
DOCUMENT STATUS
========================= */

function docStatus(value){

return value
?
'<span class="ok">✅</span>'
:
'<span class="no">❌</span>';

}


/* =========================
CLOSE MEMBER VIEW
========================= */

function closeMemberView(){

document
.getElementById("memberViewModal")
.style.display="none";

}


/* =========================
PROFILE
========================= */

function openProfileModal(){

document
.getElementById("profileModal")
.style.display="flex";

}

function closeProfileModal(){

document
.getElementById("profileModal")
.style.display="none";

}

async function saveProfile(){

alert(
"Profile Save পরবর্তী ধাপে সংযুক্ত করা হবে।"
);

closeProfileModal();

}


/* =========================
FUND
========================= */

function openBalanceModal(type){

balanceType=type;

document
.getElementById("balanceModal")
.style.display="flex";

document
.getElementById("balanceTitle")
.textContent=
type==="fund_added"
?
"➕ Add Fund"
:
"➖ Reduce Fund";

}

function closeBalanceModal(){

document
.getElementById("balanceModal")
.style.display="none";

}

async function submitBalanceChange(){

const amount=
parseFloat(
document
.getElementById("balanceAmount")
.value
);

if(!amount || amount<=0){

alert(
"সঠিক টাকার পরিমাণ দিন।"
);

return;

}

alert(
"Fund Save পরবর্তী ধাপে সংযুক্ত করা হবে।"
);

closeBalanceModal();

}


/* =========================
ESCAPE
========================= */

function escapeHtml(value){
