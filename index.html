async function deleteMember(id){

  const role = String(
    currentProfile?.role || ""
  ).toLowerCase();


  if(role !== "manager"){

    alert(
      "⛔ শুধুমাত্র Manager সদস্য Delete করতে পারবেন।"
    );

    return;
  }


  const {
    data:member,
    error:memberError
  } =
    await db
      .from("members")
      .select(
        "id,member_id,member_no,full_name"
      )
      .eq("id",id)
      .single();


  if(memberError){

    alert(
      "❌ সদস্যের তথ্য পাওয়া যায়নি:\\\\n\\\\n"+
      memberError.message
    );

    return;
  }


  const memberNo =
    member.member_id ||
    member.member_no ||
    "";


  const ok =
    confirm(

      "⚠️ সদস্য Delete\\\\n\\\\n"+
      "Member ID: "+
      memberNo+
      "\\\\nনাম: "+
      (member.full_name || "")+
      "\\\\n\\\\n"+
      "এই সদস্যের হিসাব/লেনদেন থাকলে নিরাপত্তার জন্য Delete হবে না।"+
      "\\\\n\\\\n"+
      "আপনি কি নিশ্চিত?"

    );


  if(!ok) return;


  const {
    data,
    error
  } =
    await db.rpc(
      "delete_member_if_no_transaction",
      {
        p_member_id:id
      }
    );


  if(error){

    alert(
      "❌ সদস্য Delete করা যায়নি:\\\\n\\\\n"+
      error.message
    );

    console.error(error);

    return;
  }


  alert(
    "✅ সদস্য সফলভাবে Delete হয়েছে।"
  );


  await loadMembers();
  await loadDashboard();

}


/* =========================================================
   LOAD MEMBERS
========================================================= */

async function loadMembers(){

  const tbody =
    $("memberList");

  if(!tbody) return;


  tbody.innerHTML =
    '<tr><td colspan="7">⏳ Loading...</td></tr>';


  const q =
    $("memberSearch")?.value.trim() || "";


  let query =
    db
      .from("members")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(500);


  if(q){

    query =
      query.or(
        "member_id.ilike.%"+q+
        "%,member_no.ilike.%"+q+
        "%,full_name.ilike.%"+q+
        "%,mobile.ilike.%"+q+
        "%,nid.ilike.%"+q+
        "%,nid_no.ilike.%"+q+
        "%"
      );

  }


  const {
    data,
    error
  } =
    await query;


  if(error){

    tbody.innerHTML =
      '<tr><td colspan="7">❌ '+
      esc(error.message)+
      '</td></tr>';

    return;
  }


  const list =
    data || [];


  if($("statMembers"))
    $("statMembers").textContent =
      list.length;


  if($("statActiveMembers"))
    $("statActiveMembers").textContent =
      list.filter(
        x =>
          String(x.status || "")
            .toLowerCase() ===
          "active"
      ).length;


  if(!list.length){

    tbody.innerHTML =
      '<tr><td colspan="7">'+
      '<div class="empty">'+
      'কোনো সদস্য পাওয়া যায়নি।'+
      '</div>'+
      '</td></tr>';

    return;
  }


  tbody.innerHTML =
    list.map(
      m => {

        const memberId =
          m.member_id ||
          m.member_no ||
          m.member_code ||
          "";


        const nid =
          m.nid ||
          m.nid_no ||
          "";


        const joinDate =
          m.join_date ||
          m.joining_date ||
          "";


        const status =
          m.status ||
          "active";


        const managerButtons =
          String(
            currentProfile?.role || ""
          ).toLowerCase() ===
          "manager"

          ? `

            <button
              class="primary"
              onclick="editMember('${m.id}')">
              ✏️
            </button>

            <button
              class="danger"
              onclick="deleteMember('${m.id}')">
              🗑️
            </button>

          `

          : "";


        return `

          <tr>

            <td>
              <b>${esc(memberId)}</b>
            </td>

            <td>
              ${esc(m.full_name)}
            </td>

            <td>
              ${esc(m.mobile)}
            </td>

            <td>
              ${esc(nid)}
            </td>

            <td>
              ${esc(joinDate)}
            </td>

            <td>

              <span
                class="badge ${
                  String(status)
                    .toLowerCase()==="active"
                    ?"green"
                    :"red"
                }">

                ${esc(status)}

              </span>

            </td>

            <td>

              <button
                class="secondary"
                onclick="viewMember('${m.id}')">
                👁
              </button>

              <button
                class="secondary"
                onclick="printMemberById('${m.id}')">
                🖨️
              </button>

              ${managerButtons}

            </td>

          </tr>

        `;

      }
    ).join("");

}

/*
===========================================================
 PATCH ORIGINAL SOURCE
===========================================================
*/

function patchOriginalSource(source){

  let fixed=source;


  /*
  ---------------------------------------------------------
  1. Replace broken MEMBER save/edit section
  ---------------------------------------------------------
  */

  const memberStart =
    fixed.indexOf(
      "async function saveMember(){"
    );


  const loadMarker =
    "/* =========================================================\n" +
    "   LOAD MEMBERS\n" +
    "========================================================= */";


  const memberEnd =
    fixed.indexOf(
      loadMarker,
      memberStart
    );


  if(
    memberStart !== -1 &&
    memberEnd !== -1
  ){

    const before =
      fixed.substring(
        0,
        memberStart
      );


    const after =
      fixed.substring(
        memberEnd
      );


    fixed =
      before +
      FIXED_MEMBER_CODE +
      "\n\n" +
      after;

  }


  /*
  ---------------------------------------------------------
  2. FIX loadMembers missing closing brace
  ---------------------------------------------------------
  */

  const brokenLoadEnd =
    /(\`\)\.join\(""\);\s*)(\/\* =========================================================\s*MEMBER VIEW)/;


  fixed =
    fixed.replace(
      brokenLoadEnd,
      '$1}\n\n$2'
    );


  /*
  ---------------------------------------------------------
  3. Prevent old duplicate member functions later
  ---------------------------------------------------------
  */

  /*
  Existing deleteMember later in the original file
  will be replaced by the fixed one because the original
  function declaration is still present.

  Remove the old duplicate function.
  */

  const oldDelete =
    /async function deleteMember\(id\)\{[\s\S]*?\n\}\s*\n\s*\/\* =========================================================\s*DASHBOARD/;


  fixed =
    fixed.replace(
      oldDelete,
      "\n/* =========================================================\n   DASHBOARD\n========================================================= */"
    );


  return fixed;

}


/*
===========================================================
 LOAD ORIGINAL
===========================================================
*/

async function startApplication(){

  try{

    loaderText(
      "মূল সিস্টেম লোড হচ্ছে..."
    );


    const response =
      await fetch(
        ORIGINAL_URL,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "GitHub থেকে index.html লোড করা যায়নি। HTTP "+
        response.status
      );

    }


    let source =
      await response.text();


    loaderText(
      "Member Management ঠিক করা হচ্ছে..."
    );


    source =
      patchOriginalSource(
        source
      );


    /*
    -------------------------------------------------------
    Check that broken function is gone
    -------------------------------------------------------
    */

    if(
      source.includes(
        '"manager_update_member"'
      )
    ){

      /*
      This is not fatal because the original string may
      appear elsewhere. Continue.
      */

    }


    loaderText(
      "Application চালু হচ্ছে..."
    );


    /*
    -------------------------------------------------------
    Replace this document with fixed original
    -------------------------------------------------------
    */

    document.open();

    document.write(
      source
    );

    document.close();


  }catch(error){

    console.error(error);


    loaderText(
      "সিস্টেম চালু করা যায়নি"
    );


    loaderError(
      error.message+
      "\n\nGitHub repository এবং Internet connection পরীক্ষা করুন।"
    );

  }

}
